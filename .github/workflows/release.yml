name: Release Fearless artefacts

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the release as a draft for manual review before publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release

jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      versionid: ${{ steps.version.outputs.versionid }}
      commons: ${{ steps.commits.outputs.commons }}
      frontend: ${{ steps.commits.outputs.frontend }}
      coordinator: ${{ steps.commits.outputs.coordinator }}
      standardlibrary: ${{ steps.commits.outputs.standardlibrary }}
      controllers: ${{ steps.commits.outputs.controllers }}
    steps:
      - name: Check that the workflow runs from main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow from main, not from $GITHUB_REF"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { sparse-checkout: Build/src/resources/ResolveResource.java, sparse-checkout-cone-mode: false, persist-credentials: false }
      - name: Choose the release tag and check that it is unused
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          versionId=$(sed -n 's/^ *public static final String versionId= "\([0-9_]*\)";$/\1/p' Build/src/resources/ResolveResource.java)
          if [[ ! "$versionId" =~ ^[0-9]+_[0-9]{3}$ ]]; then
            echo "::error::Build/src/resources/ResolveResource.java has no line like  public static final String versionId= \"0_001\";  restore that exact form"
            exit 1
          fi
          version="v${versionId/_/.}"
          tags=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$version" --jq '.[].ref')
          if grep -qxF "refs/tags/$version" <<< "$tags"; then
            echo "::error::The tag $version already exists in $GITHUB_REPOSITORY; raise versionId in Build/src/resources/ResolveResource.java"
            exit 1
          fi
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[].tag_name')
          if grep -qxF "$version" <<< "$releases"; then
            echo "::error::A release of $GITHUB_REPOSITORY, maybe a draft, already has the tag $version; delete it or raise versionId in Build/src/resources/ResolveResource.java"
            exit 1
          fi
          { echo "version=$version"; echo "versionid=$versionId"; } >> "$GITHUB_OUTPUT"
      - name: Choose the commit of each repository
        id: commits
        shell: bash
        env:
          COORDINATOR_COMMIT: ${{ github.sha }}
        run: |
          mainCommit(){
            local commit
            commit=$(git ls-remote "https://github.com/$1" refs/heads/main | cut -f1) || commit=""
            if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::git ls-remote https://github.com/$1 refs/heads/main did not print exactly one commit; check that the repository exists and run again"
              exit 1
            fi
            printf -v "$2" '%s' "$commit"
          }
          mainCommit FearlessLang/Commons commons
          mainCommit FearlessLang/Frontend frontend
          mainCommit FearlessLang/StandardLibrary standardlibrary
          mainCommit FearlessLang/Controllers controllers
          {
            echo "commons=$commons"
            echo "frontend=$frontend"
            echo "coordinator=$COORDINATOR_COMMIT"
            echo "standardlibrary=$standardlibrary"
            echo "controllers=$controllers"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: sources
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            label: linux-x64
          - os: windows-2025
            label: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.sources.outputs.version }}
      VERSION_ID: ${{ needs.sources.outputs.versionid }}
      LABEL: ${{ matrix.label }}
      JDK_LINUX_URL: https://download.oracle.com/java/26/archive/jdk-26.0.2_linux-x64_bin.tar.gz
      JDK_LINUX_SHA256: 11de2bce72e7f07b9e80afa9bdd950b42f3a5c69cf4969e44389d50f466959e2
      JDK_WINDOWS_URL: https://download.oracle.com/java/26/archive/jdk-26.0.2_windows-x64_bin.zip
      JDK_WINDOWS_SHA256: 530c20885a96d97c5f982a96e2d9e6aa41956c414b4a7398c49df7fe3192e62d
      ECLIPSE_LINUX_URL: https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-linux-gtk-x86_64.tar.gz
      ECLIPSE_LINUX_SHA512: 7e30aeaf1227068d00deabe45f397a9cb82a251f77c4df760e471f0811b9de4d5b5fcdfbe2ab750f0c9db68d3de763e32ae739ef4dc03617f7892f2accd3f344
      ECLIPSE_WINDOWS_URL: https://download.eclipse.org/technology/epp/downloads/release/2026-06/R/eclipse-java-2026-06-R-win32-x86_64.zip
      ECLIPSE_WINDOWS_SHA512: 6a6b0de0b833ca91d3229d845fd1e4789cf377e87405e8bb91ec65e2451aa96dfb3d91048b4fe1926dad0927077a6dfdf84ec990b4d092573a2a597539c61be3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: FearlessLang/Commons, ref: "${{ needs.sources.outputs.commons }}", path: src/Commons, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: FearlessLang/Frontend, ref: "${{ needs.sources.outputs.frontend }}", path: src/Frontend, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { ref: "${{ needs.sources.outputs.coordinator }}", path: src/Coordinator, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: FearlessLang/StandardLibrary, ref: "${{ needs.sources.outputs.standardlibrary }}", path: src/StandardLibrary, persist-credentials: false }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { repository: FearlessLang/Controllers, ref: "${{ needs.sources.outputs.controllers }}", path: src/Controllers, persist-credentials: false }
      - name: Install JDK 26 (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/jdk.tar.gz" "$JDK_LINUX_URL" || { echo "::error::curl could not download $JDK_LINUX_URL; run again, or check whether the URL moved"; exit 1; }
          echo "$JDK_LINUX_SHA256  $RUNNER_TEMP/jdk.tar.gz" | sha256sum -c - || { echo "::error::$JDK_LINUX_URL does not have the SHA-256 pinned in release.yml; compare it with the published .sha256 before changing the pin"; exit 1; }
          mkdir -p "$RUNNER_TEMP/jdk"
          tar -xzf "$RUNNER_TEMP/jdk.tar.gz" -C "$RUNNER_TEMP/jdk" --strip-components=1
          echo "JAVA_BIN=$RUNNER_TEMP/jdk/bin/java" >> "$GITHUB_ENV"
      - name: Install JDK 26 (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\curl.exe" -fsSL --retry 5 --retry-all-errors -o "$env:RUNNER_TEMP\jdk.zip" $env:JDK_WINDOWS_URL
          if ($LASTEXITCODE -ne 0){ Write-Host "::error::curl could not download $env:JDK_WINDOWS_URL; run again, or check whether the URL moved"; exit 1 }
          if ((Get-FileHash -Algorithm SHA256 "$env:RUNNER_TEMP\jdk.zip").Hash -ne $env:JDK_WINDOWS_SHA256){ Write-Host "::error::$env:JDK_WINDOWS_URL does not have the SHA-256 pinned in release.yml; compare it with the published .sha256 before changing the pin"; exit 1 }
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\jdk" | Out-Null
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\jdk.zip" -C "$env:RUNNER_TEMP\jdk" --strip-components=1
          if ($LASTEXITCODE -ne 0){ Write-Host "::error::tar could not extract jdk.zip"; exit 1 }
          $javaBin= "$env:RUNNER_TEMP\jdk\bin\java.exe" -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "JAVA_BIN=$javaBin"
      - name: Install Eclipse (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/eclipse.tar.gz" "$ECLIPSE_LINUX_URL" || { echo "::error::curl could not download $ECLIPSE_LINUX_URL; run again, or check whether the URL moved"; exit 1; }
          echo "$ECLIPSE_LINUX_SHA512  $RUNNER_TEMP/eclipse.tar.gz" | sha512sum -c - || { echo "::error::$ECLIPSE_LINUX_URL does not have the SHA-512 pinned in release.yml; compare it with the published .sha512 before changing the pin"; exit 1; }
          tar -xzf "$RUNNER_TEMP/eclipse.tar.gz" -C "$RUNNER_TEMP"
          echo "ECLIPSE_DIR=$RUNNER_TEMP/eclipse" >> "$GITHUB_ENV"
      - name: Install Eclipse (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:SystemRoot\System32\curl.exe" -fsSL --retry 5 --retry-all-errors -o "$env:RUNNER_TEMP\eclipse.zip" $env:ECLIPSE_WINDOWS_URL
          if ($LASTEXITCODE -ne 0){ Write-Host "::error::curl could not download $env:ECLIPSE_WINDOWS_URL; run again, or check whether the URL moved"; exit 1 }
          if ((Get-FileHash -Algorithm SHA512 "$env:RUNNER_TEMP\eclipse.zip").Hash -ne $env:ECLIPSE_WINDOWS_SHA512){ Write-Host "::error::$env:ECLIPSE_WINDOWS_URL does not have the SHA-512 pinned in release.yml; compare it with the published .sha512 before changing the pin"; exit 1 }
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\eclipse.zip" -C "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0){ Write-Host "::error::tar could not extract eclipse.zip"; exit 1 }
          $eclipseDir= "$env:RUNNER_TEMP\eclipse" -replace '\\','/'
          Add-Content -Path $env:GITHUB_ENV -Value "ECLIPSE_DIR=$eclipseDir"
      - name: Generate LocalResources.java
        shell: bash
        run: |
          prefix="${GITHUB_WORKSPACE//\\//}/src"
          cat > "$prefix/Coordinator/Build/src/resources/LocalResources.java" <<JAVA
          package resources;
          import java.nio.file.Path;
          public class LocalResources{
            private static Path prefix= Path.of("$prefix");
            static public final Path stLibPath= prefix.resolve("StandardLibrary","base");
            static public final Path stLibRTPath= prefix.resolve("StandardLibrary","rt");
            static public final Path stLibDebugOut= prefix.resolve("StandardLibrary","dbgOut");
            static public final Path integrationTests= prefix.resolve("StandardLibrary","integrationTests");
            static public final Path commonsSrc= prefix.resolve("Commons","src");
            static public final Path frontendSrc= prefix.resolve("Frontend","FearlessFrontend","src");
            static public final Path frontendSrcModule= prefix.resolve("Frontend","FearlessFrontend","srcModule");
            static public final Path coordinatorSrc= prefix.resolve("Coordinator","src");
            static public final Path coordinatorSrcModule= prefix.resolve("Coordinator","srcModule");
            static public final Path controllerSrc= prefix.resolve("Controllers","src");
            static public final Path controllerSrcModule= prefix.resolve("Controllers","srcModule");
            static public final Path portableFolderOut= prefix.resolve("out","fearlessArtefact");
            static public final Path managedFolderOut= prefix.resolve("out","fearlessManagedArtefact");
            static public final Path badZipCorpous= prefix.resolve("Coordinator","badZips");
            static public final Path packaging= prefix.resolve("Coordinator","_fearless_packaging");
            static public final Path portableEclipse= Path.of("${ECLIPSE_DIR:?}");
          }
          JAVA
      - name: Build portable Fearless
        shell: bash
        working-directory: src/Coordinator/Build/src
        run: "\"$JAVA_BIN\" -ea --module-path ../../../Commons/Commons.jar --add-modules Commons scripts/DeployPortableFearless.java"
      - name: Run the portable Fearless on helloWorld (linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        shell: bash
        env:
          LANG: C.UTF-8
        run: |
          rc=0
          out=$("$GITHUB_WORKSPACE/src/out/fearlessArtefact/fearlessBin$VERSION_ID/bin/fearlessBin$VERSION_ID" "$GITHUB_WORKSPACE/src/StandardLibrary/integrationTests/helloWorld") || rc=$?
          if [[ $rc != 0 || "$(head -n 1 <<< "$out")" != "hello world 3" ]]; then
            echo "::error::The portable Fearless exited with code $rc and did not print \"hello world 3\" as its first line on helloWorld; its output is below, its error output above"
            echo "$out"
            exit 1
          fi
      - name: Run the portable Fearless on helloWorld (windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        shell: pwsh
        run: |
          $out= & "$env:GITHUB_WORKSPACE\src\out\fearlessArtefact\fearlessBin$env:VERSION_ID\fearlessBin$env:VERSION_ID.exe" "$env:GITHUB_WORKSPACE\src\StandardLibrary\integrationTests\helloWorld"
          if ($LASTEXITCODE -ne 0 -or @($out)[0] -cne 'hello world 3'){
            Write-Host "::error::The portable Fearless exited with code $LASTEXITCODE and did not print `"hello world 3`" as its first line on helloWorld; its output is below, its error output above"
            $out
            exit 1
          }
      - name: Build managed Fearless
        shell: bash
        working-directory: src/Coordinator/Build/src
        run: "\"$JAVA_BIN\" -ea --module-path ../../../Commons/Commons.jar --add-modules Commons scripts/DeployManagedFearless.java"
      - name: Package artefacts (linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          (cd "$GITHUB_WORKSPACE/src/out/fearlessArtefact" && zip -qr "$GITHUB_WORKSPACE/dist/fearless-portable-$LABEL-$VERSION.zip" .)
          (cd "$GITHUB_WORKSPACE/src/out/fearlessManagedArtefact" && zip -qr "$GITHUB_WORKSPACE/dist/fearless-managed-$LABEL-$VERSION.zip" .)
      - name: Package artefacts (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:GITHUB_WORKSPACE/dist" | Out-Null
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/src/out/fearlessArtefact/*" -DestinationPath "$env:GITHUB_WORKSPACE/dist/fearless-portable-$env:LABEL-$env:VERSION.zip"
          Compress-Archive -Path "$env:GITHUB_WORKSPACE/src/out/fearlessManagedArtefact/*" -DestinationPath "$env:GITHUB_WORKSPACE/dist/fearless-managed-$env:LABEL-$env:VERSION.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: fearless-${{ matrix.label }}-${{ needs.sources.outputs.version }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: [sources, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with: { path: dist, merge-multiple: true }
      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT: ${{ inputs.draft }}
          VERSION: ${{ needs.sources.outputs.version }}
          COMMONS: ${{ needs.sources.outputs.commons }}
          FRONTEND: ${{ needs.sources.outputs.frontend }}
          COORDINATOR: ${{ needs.sources.outputs.coordinator }}
          STANDARDLIBRARY: ${{ needs.sources.outputs.standardlibrary }}
          CONTROLLERS: ${{ needs.sources.outputs.controllers }}
        run: |
          notes="Portable and Managed Fearless builds for Linux and Windows, built with the JDK and the Eclipse named in .github/workflows/release.yml, from:
          - FearlessLang/Commons $COMMONS
          - FearlessLang/Frontend $FRONTEND
          - $GITHUB_REPOSITORY $COORDINATOR
          - FearlessLang/StandardLibrary $STANDARDLIBRARY
          - FearlessLang/Controllers $CONTROLLERS"
          draft=()
          if [[ "$DRAFT" == true ]]; then draft=(--draft); fi
          gh release create "$VERSION" dist/*.zip --repo "$GITHUB_REPOSITORY" --target "$COORDINATOR" --title "Fearless $VERSION" --notes "$notes" "${draft[@]}"
